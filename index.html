<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>
			HeroQuest - Digital Dungeon Navigator
		</title>
		<style>
			*, *::before, *::after { box-sizing: border-box; }

			body {
				margin: 0;
				padding: 0 12px 28px;
				text-align: center;
				background-color: #3f2f00;
				-webkit-text-size-adjust: 100%;
			}

			/* The room scans carry an EXIF Orientation tag, which the browser
			   already applies, so no rotation classes are needed here. The
			   original rotate90 / rotate180 / rotate270 block was commented
			   out but nested its comments, so it ended early and left two of
			   those rules live plus a stray comment terminator behind. */
			img {
				image-orientation: from-image;
			}

			.page {
				width: 100%;
				max-width: 1200px;
				margin-left: auto;
				margin-right: auto;
			}

			.site_head {
				padding-top: 14px;
			}

			.site_head img {        /* logo is 398x133 */
				width: 100%;
				max-width: 398px;
				height: auto;
			}

			.site_head h1 {
				color: #ffffff;
				font-size: clamp(20px, 5vw, 32px);
				margin: 10px 0 0 0;
			}

			/* ---- layout ------------------------------------------------
			   Was a fixed 80%-wide <table> of three cells. Same three zones,
			   now a flex row that stacks below 860px. ------------------- */

			.panel {
				margin-top: 12px;
				padding: 10px;
				background-color: #4f3f00;
				text-align: center;
			}

			.layout {
				display: flex;
				align-items: flex-start;
				gap: 10px;
			}

			.col_menu   { flex: 0 0 200px; }
			.col_room   { flex: 1 1 auto; min-width: 0; }   /* min-width:0 lets a wide scan shrink */
			.col_guides { flex: 0 0 200px; }

			.mainMenuContainer {
				margin-left: auto;
				margin-right: auto;
				margin-top: 10px;
				width: 100%;
				border: 1px solid #000000;
			}

			.mainMenuContainer ul {
				list-style: none;
				padding: 0 0 0 0;
				margin: 0 0 0 0;
			}

			.mainMenuContainer ul li {
				color: #ffffff;
				background-color: #3f3f00;
				margin: 0px 0px 0px 0px;
			}

			.mainMenuContainer ul li ul li {
				color: #ffffff;
				background-color: #5f5f00;
			}

			/* the clickable text itself, padded out to a real tap target */
			.mainMenuContainer li > div {
				padding: 8px 6px;
				cursor: pointer;
			}

			.mainMenuContainer li > div:hover {
				background-color: #6f6f10;
			}

			#display_room {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 610px;
				margin-top: 10px;
				padding: 4px;
				border: 1px solid #000000;
				background-color: #000000;
				overflow: hidden;
			}

			#display_room img {
				max-width: 100%;                  /* a wide corridor scan shrinks instead of
				                                     running off the side of the page */
				max-height: min(600px, 72vh);
				width: auto;
				height: auto;
				cursor: zoom-in;
			}

			.welcome {
				color: #ffffff;
				max-width: 400px;
				margin: 0 auto;
				padding: 20px;
				font-size: clamp(17px, 3.5vw, 24px);
				font-weight: bold;
			}

			#display_navigation {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
				min-height: 50px;
				margin-top: 16px;
			}

			.navButton {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 48px;
				min-height: 44px;            /* thumb-sized, for playing off a tablet */
				padding: 10px 15px;
				border: 1px solid #000000;
				background-color: #dddddd;
				color: #000000;
				cursor: pointer;
				user-select: none;
				-webkit-user-select: none;
			}

			.navButton:hover  { background-color: #ffffff; }
			.navButton:active { background-color: #bbbbbb; }

			#display_help_links {
				width: 100%;
				margin-top: 10px;
			}

			#display_help_links ul {
				list-style: none;
				padding: 0 0 0 0;
				margin: 0 0 0 0;
				color: #ffffff;
			}

			#display_help_links li > div {
				padding: 8px 6px;
				margin-bottom: 6px;
				border: 1px solid #000000;
				background-color: #3f3f00;
				cursor: pointer;
			}

			#display_help_links li > div:hover {
				background-color: #6f6f10;
			}

			.helpOff {
				display: none;
			}

			/* full-screen overlay: tap anywhere to dismiss */
			.helpOn {
				display: flex;
				align-items: center;
				justify-content: center;
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				left: 0;
				z-index: 50;
				padding: 16px;
				overflow: auto;
				background-color: rgba(0, 0, 0, 0.88);
				cursor: zoom-out;
			}

			.helpOn img {
				max-width: 100%;
				max-height: 100%;
				width: auto;
				height: auto;
				border: 2px solid #000000;
			}

			.ui_switch {
				margin-top: 8px;
				font-size: 10pt;
			}

			.ui_switch a {
				display: inline-block;
				color: #c9a227;
				text-decoration: none;
				border: 1px solid #6b5410;
				border-radius: 4px;
				padding: 7px 12px;
				background-color: #4f3f00;
			}

			.ui_switch a:hover {
				border-color: #c9a227;
			}

			.rights_information {
				color: #ffffff;
				font-size: 8pt;
			}

			/* ---- stacked, for phones and portrait tablets -------------- */
			@media (max-width: 860px) {
				body { padding: 0 8px 20px; }

				.layout { flex-direction: column; }

				.col_menu, .col_room, .col_guides { flex: 1 1 auto; width: 100%; }

				.mainMenuContainer { margin-top: 0; }

				#display_room {
					min-height: 240px;
					margin-top: 8px;
				}

				#display_room img { max-height: 68vh; }

				/* guides read as a row of chips rather than a sidebar */
				#display_help_links ul {
					display: flex;
					flex-wrap: wrap;
					justify-content: center;
					gap: 6px;
				}

				#display_help_links li > div { margin-bottom: 0; }

				#display_navigation { margin-top: 12px; }
			}
		</style>
		<script src="js/quest.js"></script>
	</head>
	<body>
		<div class="page">
			
			<div class="site_head">
				<img src="source/heroquest-logo.png" alt="HeroQuest" />
				<h1>Digital Dungeon Navigator</h1>
				<div class="ui_switch">
					<a href="modern.html" title="Responsive layout, explored-room tracking, resumable links">Modern interface &rarr;</a>
				</div>
			</div>
			
			<div class="panel">
				<div class="layout">
					<div class="col_menu">
						<div id="main_menu_container" class="mainMenuContainer">
							<ul id="main_menu">
								
							</ul>
						</div>
					</div>
					<div class="col_room">
						<div id="display_room">
							<div class="welcome">
								Welcome!<br>Please select a quest from the menu.
							</div>
						</div>
					</div>
					<div class="col_guides">
						<div id="display_help_links">
							<ul id="help_link_list">
							
							</ul>
						</div>
					</div>
				</div>
				<div id="display_navigation">
				</div>
			</div>
			
			
			<p class="rights_information">
				Original Digital Dungeonmaster files created by Chris Marlow (marlowc).<br>
				Programming by David Allison (lastgunslinger)<br>
				HeroQuest&trade;	is the property of Milton Bradley and Games Workshop<br><br>
				Version 0.9
			</p>
			
			<div id="room_list_container" style="display:none;">
				<ul id="room_list">
				</ul>
			</div>
			<div id="quest_help_container" style="display:none;">
				<ul id="quest_help">
				</ul>
			</div>
		</div>
		
		<div id="help_popup" class="helpOff" onclick="javascript:hideHelp()">
		
		</div>
		
		<script>			
			function getHelp(quest, helpNumber) {
				if(helpNumber) {
					if(questList[quest].help[helpNumber]) return questList[quest].folder + '/' + questList[quest].help[helpNumber];
				}
			}
			
			// Room keys are r<n> in most packs, and the button shows <n> to match the
			// number printed beside the door. Dark Company is one dungeon spanning 13
			// sections, so its keys are s<section>p<page>; the button shows the page.
			var SECKEY = /^s(\d+)p(\d+)$/;

			function roomLabel(key) {
				var m = SECKEY.exec(key);
				return m ? m[2] : key.substr(1);
			}

			// Two Dark Company rooms have doors onto the same page number in two
			// different sections, so the tooltip spells the destination out.
			function roomTitle(key) {
				var m = SECKEY.exec(key);
				return m ? 'Section ' + m[1] + ', page ' + m[2] : 'Room ' + key.substr(1);
			}

			function loadQuest(questPack, quest) {
				var roomList = document.getElementById('room_list');
				var rotation = '';
				while(roomList.firstChild) {
					roomList.removeChild(roomList.firstChild);
				}
				
				for(var room in questList[questPack].quests[quest].rooms) {
					if(questList[questPack].quests[quest].rooms[room].rotation) rotation = ' class="' + questList[questPack].quests[quest].rooms[room].rotation + '"';
					else rotation = '';
					roomList.innerHTML += '<li id="index_' + room + '"><img' + rotation + ' id="' + room + '"src="' + [questList[questPack].folder, questList[questPack].quests[quest].folder, questList[questPack].quests[quest].rooms[room].file].filter(Boolean).join('/') +'" /></li>';
				}
				
				for(var first in questList[questPack].quests[quest].rooms) {
					loadRoom(questPack, quest, first);
					break;
				}
				loadHelp(questPack);
				
				// Stacked on a narrow screen the menu sits above the room, so picking
				// a quest would otherwise leave the map off-screen.
				if(window.matchMedia && window.matchMedia('(max-width: 860px)').matches) {
					document.getElementById('display_room').scrollIntoView({block: 'start'});
				}
			}
			
			function loadRoom(questPack, quest, room) {
					var currentRoom = document.getElementById('display_room');
					while(currentRoom.firstChild) currentRoom.removeChild(currentRoom.firstChild);
					var newRoom = document.getElementById(room);
					var newRoomCopy = newRoom.cloneNode(newRoom);
					newRoomCopy.onclick = zoomRoom;
					currentRoom.appendChild(newRoomCopy);
					
					var currentNav = document.getElementById('display_navigation');
					
					var navList = '';
					if(questList[questPack].quests[quest].rooms[room].connections) {
						var roomConnections = questList[questPack].quests[quest].rooms[room].connections.toString().split(',');
						for(var i = 0; i< roomConnections.length; i++) {
							navList += '<div class="navButton" title="' + roomTitle(roomConnections[i]) + '" onclick="javascript:loadRoom(\''+ questPack+ '\',\''+ quest + '\',\''+ roomConnections[i] + '\')">' + roomLabel(roomConnections[i]) + '</div>';
						}
					}
					currentNav.innerHTML = navList;
			}
			
			function loadHelp(questPack) {
				var helpLinks = document.getElementById('help_link_list');
				while(helpLinks.firstChild) helpLinks.removeChild(helpLinks.firstChild);
				
				// Every pack numbers its guides from h1, and showHelp() finds the image
				// by getElementById, so guides left here by a previously opened pack
				// shadow this one's. Clear them like the link list above.
				var helpImages = document.getElementById('quest_help');
				while(helpImages.firstChild) helpImages.removeChild(helpImages.firstChild);
				
				var rotation = '';
				
				if(questList[questPack].help) {
					for(var helpItem in questList[questPack].help) {
						if(questList[questPack].help[helpItem].rotation) rotation = ' class="' + questList[questPack].help[helpItem].rotation + '"';
						else rotation = '';
					
						helpImages.innerHTML += '<li id="index_' + helpItem + '"><img' + rotation + ' id="' + helpItem + '"src="' + questList[questPack].folder+'/'+questList[questPack].help[helpItem].file +'" onclick="javascript:hideHelp(\''+ helpItem + '\')"/></li>';
						helpLinks.innerHTML += '<li><div onclick="javascript:showHelp(\''+ helpItem + '\');">' + questList[questPack].help[helpItem].name + '</div></li>';
					}
				}
			}
			
			// Shrunk to fit a phone, a landscape map is only a few hundred pixels
			// across. Tapping it fills the screen, reusing the guide overlay.
			function zoomRoom() {
				var shown = document.querySelector('#display_room img');
				if(!shown) return;
				var helpPopUp = document.getElementById('help_popup');
				while(helpPopUp.firstChild) helpPopUp.removeChild(helpPopUp.firstChild);
				var blownUp = shown.cloneNode(true);
				blownUp.removeAttribute('id');      /* keep getElementById(room) unambiguous */
				blownUp.onclick = null;
				helpPopUp.appendChild(blownUp);
				helpPopUp.className = 'helpOn';
			}
			
			function showHelp(helpIndex) {
				var helpPopUp = document.getElementById('help_popup');
				while(helpPopUp.firstChild) helpPopUp.removeChild(helpPopUp.firstChild);
				
				var helpFile = document.getElementById(helpIndex);
				var newHelpFile = helpFile.cloneNode();
				helpPopUp.appendChild(newHelpFile);
				helpPopUp.className = 'helpOn';
			}
			
			function hideHelp(helpIndex) {
				var helpPopUp = document.getElementById('help_popup');
				while(helpPopUp.firstChild) helpPopUp.removeChild(helpPopUp.firstChild);
				helpPopUp.className = 'helpOff';
			}
			
			function toggleSubMenu(questPack) {
				var questOption = document.getElementById(questPack);
				if(questOption.firstChild) {
					while(questOption.firstChild) questOption.removeChild(questOption.firstChild);
				}
				else {
					for(var quest in questList[questPack].quests) {
						questOption.innerHTML += '<li><div id="' + questPack + '_' + quest + '" onclick="loadQuest(\'' + questPack + '\', \'' + quest + '\')">'+questList[questPack].quests[quest].name+'</div></li>';
					}
				}
			}
			
			var mainMenu = document.getElementById('main_menu');
			for(var questPack in questList) {
				mainMenu.innerHTML += '<li><div onclick="javascript:toggleSubMenu(\'' + questPack + '\')">'+questList[questPack].name+'</div><ul id="' + questPack + '"></ul></li>';
			}
		</script>
	</body>
</html>
